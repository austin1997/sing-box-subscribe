[project]
name = "sing-box-subscribe-cloudflare"
version = "1.0.0"
description = "Cloudflare Workers runtime adapter for Toperlock/sing-box-subscribe"
requires-python = ">=3.12"
dependencies = [
    "Flask==2.3.2",
    "requests==2.32.3",
    "chardet==5.2.0",
    "PyYAML==6.0.3",
    "ruamel.yaml==0.18.6",
    "workers-runtime-sdk>=1.8.2",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk>=1.8.2",
    "pytest>=8.0",
]
