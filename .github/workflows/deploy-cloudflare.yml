name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run adapter tests
        run: PYTHONPATH=. uv run pytest -q tests/test_cloudflare_adapter.py

      - name: Prepare Cloudflare build
        run: rm -f requirements.txt

      - name: Deploy Cloudflare Worker
        run: |
          set -o pipefail
          uv run pywrangler deploy | tee /tmp/pywrangler-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/pywrangler-deploy.log | tail -n 1)"
          test -n "$WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test deployed Worker
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if curl -fsS "$WORKER_URL/healthz" | grep -q '"status":"ok"'; then
              curl -fsS -o /dev/null "$WORKER_URL/"
              echo "Worker smoke test passed: $WORKER_URL"
              exit 0
            fi
            sleep 3
          done
          echo "Worker smoke test failed: $WORKER_URL"
          curl -i "$WORKER_URL/healthz" || true
          curl -i "$WORKER_URL/" || true
          exit 1
